<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وتواصوا — لا أحد يلتزم وحده</title>
<meta name="description" content="لا أحد يلتزم وحده. حلقة صغيرة، هدف واحد، ثلاثون يومًا، وسدرة تكبر بالتزامكم.">
<meta name="theme-color" content="#C9DCC2">
<link rel="icon" href="./app/favicon.ico">
<link rel="apple-touch-icon" href="./app/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="وتواصوا — لا أحد يلتزم وحده">
<meta property="og:description" content="لا أحد يلتزم وحده. حلقة صغيرة، هدف واحد، ثلاثون يومًا، وسدرة تكبر بالتزامكم.">
<meta property="og:image" content="https://iam0riarty.github.io/watawasaw-directions/app/art/trees/t12-full.jpg">
<meta property="og:locale" content="ar_QA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== الاتجاه ج: السدرة =====
   السدرة الحقيقية — فنّ التطبيق نفسه — تملأ الشاشة، وفوقها لوحٌ زجاجي.
   يرى الزائر ما سيراه داخل التطبيق قبل أن يدخل: شجرةٌ تكبر بالتزام حلقةٍ صغيرة. */
:root{
  --ink:#10180F; --ink2:#36432F; --mute:#6B7A62;
  --gold:#A8640F; --gold2:#C7973A; --on-gold:#fff;
  --glass:rgba(255,255,255,.62); --edge:rgba(255,255,255,.75);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{margin:0;font-family:"Alexandria",system-ui,sans-serif;font-weight:300;color:var(--ink);background:#C9DCC2;
  display:flex;align-items:flex-end;justify-content:center}
.wrap{position:relative;width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
/* الصورة ملء الشاشة (WebP وبديل JPG)، ويتدرّج أسفلها إلى لون الأرض فيستقرّ عليه اللوح */
.hero{position:absolute;inset:0;background:#C9DCC2}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 26%,rgba(236,243,232,.55) 60%,rgba(240,246,237,.96) 86%,#F2F7EF 100%)}
.card{position:relative;margin:0 18px 26px;padding:24px 22px 22px;border-radius:26px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.1);
  box-shadow:inset 0 1px 0 var(--edge),0 22px 46px rgba(16,32,14,.16)}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
  color:var(--gold);background:rgba(168,100,15,.09)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
h1{margin:14px 0 0;font-size:28px;font-weight:600;line-height:1.45;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--gold)}
p{margin:10px 0 0;font-size:14.5px;line-height:1.95;color:var(--ink2);font-weight:300}
.steps{margin:18px 0 0;padding:0;list-style:none;display:flex;gap:8px}
.steps li{flex:1;padding:11px 8px;border-radius:14px;text-align:center;background:rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.8)}
.steps b{display:block;font-size:15px;font-weight:700;color:var(--gold)}
.steps span{display:block;margin-top:3px;font-size:12px;color:var(--mute)}
.cta{margin:18px 0 0;display:block;width:100%;padding:17px;border:0;border-radius:15px;
  font:inherit;font-size:15.5px;font-weight:600;color:var(--on-gold);text-align:center;text-decoration:none;
  background:linear-gradient(145deg,var(--gold2),var(--gold));box-shadow:0 10px 28px rgba(168,100,15,.26)}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero" aria-hidden="true">
    <picture>
      <source srcset="./app/art/trees/t12-full.webp" type="image/webp">
      <img src="./app/art/trees/t12-full.jpg" alt="" fetchpriority="high" decoding="async">
    </picture>
  </div>
  <section class="card">
    <span class="badge"><i></i>حلقة صغيرة · سِدرة واحدة</span>
    <h1>لا أحد يلتزم <em>وحده</em>.</h1>
    <p>حلقة صغيرة حتى عشرة، هدف واحد، ثلاثون يومًا. كل يوم تلتزمون فيه تورق السدرة، وعند الحصاد تُغرس سدرةٌ حقيقية.</p>
    <ul class="steps">
      <li><b>١</b><span>أنشئ حلقتك</span></li>
      <li><b>٢</b><span>التزموا يوميًا</span></li>
      <li><b>٣</b><span>احصدوا سدرة</span></li>
    </ul>
    <a class="cta" href="./app/">ابدأ حلقتك</a>
  </section>
</main>
</body>
</html>
