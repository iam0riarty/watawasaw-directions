<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>وتواصوا — السدرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Amiri+Quran&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050914;--bg2:#0B1226;
  --glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.03);--edge:rgba(255,255,255,.14);--sheen:rgba(255,255,255,.2);
  --ink:#F3F5FA;--ink2:#C7CDDC;--mute:#8D97B0;
  --gold:#F0CE83;--gold2:#D9AE55;--gold-dim:rgba(240,206,131,.16);
  --leaf:#5CE3A8;--leaf2:#C2F5DE;--wilt:#6E6050;
  --shadow:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Alexandria",system-ui,sans-serif;font-size:15px;line-height:1.55;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
svg,img{display:block}
h1,h2,p{margin:0}
.brand{font-family:"Aref Ruqaa",serif;font-weight:700;color:var(--gold)}
.ayah{font-family:"Amiri Quran","Amiri",serif}
.device{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:720px){body{display:flex;align-items:center;justify-content:center;background:#02040A}
  .device{height:min(900px,calc(100% - 40px));width:400px;border-radius:44px;overflow:hidden;border:1px solid var(--edge);box-shadow:var(--shadow)}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.nav{position:absolute;inset-inline:18px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:26px;z-index:30;
  background:linear-gradient(150deg,var(--glass),var(--glass2));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 var(--sheen)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;height:52px;border-radius:20px;color:var(--mute);font-size:11.5px;font-weight:600;transition:color .2s,background .2s}
.nav button[aria-current]{color:var(--gold);background:var(--gold-dim)}
.nav svg{width:22px;height:22px}
.card{border-radius:22px;padding:14px 16px;background:linear-gradient(150deg,var(--glass),var(--glass2));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--sheen)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:12.5px}.xs{font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(5,9,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--edge);color:var(--ink2)}
.pill.gold{color:var(--gold);border-color:rgba(240,206,131,.35)}
.pill.leaf{color:var(--leaf);border-color:rgba(92,227,168,.35)}

/* المشهد: الصورة الفنية + طبقة الإضاءة */
.hero{position:relative;width:100%;aspect-ratio:752/1200;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.hero svg.light{position:absolute;inset:0;width:100%;height:100%}
.hero .fadeb{position:absolute;inset-inline:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,var(--bg) 85%);pointer-events:none}
.hero .fadet{position:absolute;inset-inline:0;top:0;height:120px;background:linear-gradient(180deg,rgba(5,9,20,.75),transparent);pointer-events:none}
.hdr{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline:20px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.hdr .brand{font-size:28px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.goal{position:absolute;inset-inline:20px;top:calc(56px + env(safe-area-inset-top));text-align:center;z-index:3;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.goal h1{font-size:19px;font-weight:600}
.goal p{font-size:12px;color:var(--ink2);margin-top:1px;opacity:.9}

/* الفعل */
.act{display:flex;flex-direction:column;align-items:center;margin-top:-78px;position:relative;z-index:4}
.big{position:relative;width:124px;height:124px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 50% 25%,#182446,#070C1A 70%);border:1px solid rgba(240,206,131,.45);
  box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 8px rgba(240,206,131,.08),0 0 60px rgba(240,206,131,.12),inset 0 1px 0 var(--sheen)}
.big b{font-size:32px;line-height:1;font-weight:700;color:var(--gold)}
.big span{font-size:11px;color:var(--mute);font-weight:500}
.big.done{border-color:rgba(92,227,168,.7);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 8px rgba(92,227,168,.12),0 0 80px rgba(92,227,168,.3)}
.big svg{width:36px;height:36px;color:var(--leaf)}
.big .ring{position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--gold);opacity:0;pointer-events:none}
.stat{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.goldline{margin:14px 24px 0;text-align:center;font-size:12px;color:var(--gold)}
.word{margin:14px 20px 0;padding:16px 18px;border-radius:22px;background:linear-gradient(150deg,var(--gold-dim),transparent);border:1px solid rgba(240,206,131,.22)}
.word .ayah{font-size:21px;line-height:2;color:var(--gold)}
.buddy{margin:12px 20px 0}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0B1020;flex:none;background:linear-gradient(180deg,#F3DC9C,#C9A24B)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:14px;font-weight:600;font-size:13px;background:var(--glass);border:1px solid var(--edge);transition:transform .12s}
.btn:active{transform:scale(.96)}
.dev{margin:18px 20px 0;padding:12px 14px;border-radius:18px;border:1px dashed var(--edge)}
.dev input{width:100%;accent-color:var(--gold);margin-top:6px}
.dev .xs{display:flex;justify-content:space-between}

/* بستاني */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi .card{text-align:center;padding:12px 6px}
.kpi b{display:block;font-size:26px;line-height:1.2;font-weight:700;color:var(--gold)}
.kpi span{font-size:11px;color:var(--mute)}
.garden{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 10px 12px;overflow:hidden}
.mini .thumb{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;margin-bottom:6px}
.mini .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%}
.mini .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.mini b{font-size:13px;font-weight:600}
.seed{border-style:dashed;justify-content:center;color:var(--mute);min-height:200px}
.seed .s{width:44px;height:44px;border-radius:50%;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.seed .s svg{width:22px;height:22px}
.forest{margin-top:12px;width:100%;text-align:start;padding:0;overflow:hidden;position:relative}
.forest img{width:100%;height:120px;object-fit:cover;object-position:50% 40%;opacity:.9}
.forest .t{position:absolute;inset:0;padding:14px 16px;background:linear-gradient(90deg,rgba(5,9,20,.92),rgba(5,9,20,.4));display:flex;flex-direction:column;justify-content:center;gap:4px}

.toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-160%);opacity:0;padding:10px 16px;border-radius:14px;font-weight:600;font-size:13px;z-index:80;width:max-content;max-width:88%;text-align:center;
  background:var(--bg2);border:1px solid var(--edge);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.toast.on{transform:translate(-50%,0);opacity:1}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:70}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:no-preference){
  .lit{transform-box:fill-box;transform-origin:center;animation:litin .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(.3s + var(--i) * 26ms)}
  @keyframes litin{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .lit.new{animation:litnew 1.1s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:.1s}
  @keyframes litnew{0%{transform:scale(0);opacity:0}50%{transform:scale(1.8);opacity:1}100%{transform:scale(1);opacity:1}}
  .pend{animation:pend 2s ease-in-out infinite}
  @keyframes pend{0%,100%{opacity:.35}50%{opacity:1}}
  .fruit{transform-box:fill-box;transform-origin:center;animation:litin .8s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(.6s + var(--i) * 70ms)}
  .big{transition:transform .25s cubic-bezier(.34,1.45,.5,1),box-shadow .5s,border-color .5s}
  .big:active{transform:scale(.93)}
  .big.pop{animation:pop .55s cubic-bezier(.34,1.45,.5,1)}
  @keyframes pop{0%{transform:scale(.93)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  .big.pop .ring{animation:ring 1s ease-out both}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="device" id="device">
  <main class="screen" id="screen"></main>
  <nav class="nav" id="nav" aria-label="التنقل"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="soft"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="lglow"><stop offset="0" stop-color="#C2F5DE" stop-opacity=".95"/><stop offset=".35" stop-color="#5CE3A8" stop-opacity=".55"/><stop offset="1" stop-color="#5CE3A8" stop-opacity="0"/></radialGradient>
  <radialGradient id="gglow"><stop offset="0" stop-color="#FFF2C4" stop-opacity="1"/><stop offset=".3" stop-color="#F0CE83" stop-opacity=".7"/><stop offset="1" stop-color="#F0CE83" stop-opacity="0"/></radialGradient>
</defs></svg>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function N(n){return Number(n).toLocaleString("ar-EG")}
var I={tree:'<path d="M12 21v-6M12 15c-4 0-7-3-7-7 3 0 5 1 7 3 2-2 4-3 7-3 0 4-3 7-7 7z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/>',
 garden:'<path d="M4 20h16M7 20v-5a3 3 0 0 1 6 0v5M15 20v-8a3 3 0 0 1 6 0v8"/><circle cx="10" cy="7" r="3"/><circle cx="18" cy="5" r="2"/>',
 check:'<path d="M5 12.5 10 17.5 19 7"/>',seed:'<path d="M12 3c5 0 8 4 8 9-5 0-8-4-8-9zM12 3c-5 0-8 4-8 9 5 0 8-4 8-9zM12 12v9"/>'};
function ic(n,w){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>'}
var ART="art/tree-1.jpg",ART2="art/tree-2.jpg";
var MISS={3:[3,7,9,10,11,17,22],4:[2,6,11,12,19,20,21,25],1:[4,16],7:[8,23],9:[5,9,12,13,27],5:[10],2:[],6:[14,28],8:[18],10:[26,29],11:[6,15,24],0:[7]};
var WORDS=[["كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ","إبراهيم ٢٤"],["تُؤْتِي أُكُلَهَا كُلَّ حِينٍ بِإِذْنِ رَبِّهَا","إبراهيم ٢٥"],["أحبُّ الأعمال إلى الله أدومُها وإن قلَّ","متفق عليه"],["وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ","العصر ٣"],["فَاسْتَبِقُوا الْخَيْرَاتِ","البقرة ١٤٨"]];
var Q=new URLSearchParams(location.search);
var S={tab:Q.get("tab")||"tree",day:+(Q.get("day")||12),done:Q.get("done")==="1",newLeaf:false,goal:"القراءة، ديسمبر",sub:"١٠ صفحات يوميًا",dedic:"لأبي، رحمه الله"};

/* ١٢ غصنًا مرسومة فوق الصورة الفنية (إحداثيات الصورة 752×1344). الغصن 0 هو غصن العضو. */
var F={x:378,y:722};
var TIPS=[[300,262],[360,238],[215,340],[140,446],[92,566],[76,690],[456,262],[396,238],[541,340],[616,446],[664,566],[680,690]];
function geo(i){var t=TIPS[i],e={x:t[0],y:t[1]},mx=(F.x+e.x)/2,my=(F.y+e.y)/2,dx=e.x-F.x,dy=e.y-F.y,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
  var side=e.x<F.x?1:-1;var c={x:mx+nx*44*side,y:my+ny*44*side-20};return {s:F,c:c,e:e}}
function bez(g,t){var u=1-t;return {x:u*u*g.s.x+2*u*t*g.c.x+t*t*g.e.x,y:u*u*g.s.y+2*u*t*g.c.y+t*t*g.e.y}}
function leafPos(g,d){var t=.08+.92*d/30,p=bez(g,t),q=bez(g,Math.min(1,t+.02)),a=Math.atan2(q.y-p.y,q.x-p.x)+Math.PI/2,side=(d%2?1:-1),off=10+(d%3)*8;
  return {x:p.x+Math.cos(a)*off*side,y:p.y+Math.sin(a)*off*side}}
function leafState(r,d,day,done){if(d>day)return null;if(r===0&&d===day)return done?"d":"p";return (MISS[r]||[]).indexOf(d)>-1?"m":"d"}
function rate(r,day,done){var dd=0,tt=0;for(var d=1;d<=day;d++){var s=leafState(r,d,day,done);if(s==="p")continue;tt++;if(s==="d")dd++}return tt?dd/tt:0}

/* طبقة الإضاءة: الصورة مظلمة، وكل ورقة «تم» تكشف بقعة ضوء من الشجرة الحقيقية */
function lightSVG(o){
  var day=o.day,done=o.done,mini=o.mini,id="m"+(mini?"mini":"main")+(o.k||"");
  var vb=mini?"120 230 512 512":"0 0 752 1200";
  var h='<svg class="light" viewBox="'+vb+'" preserveAspectRatio="xMidYMin slice" role="img" aria-label="شجرة الدفعة، اليوم '+N(day)+'">';
  var mask='',lit='',fr='';
  for(var i=0;i<12;i++){var g=geo(i);
    for(var d=1;d<=30;d++){var st=leafState(i,d,day,done);if(!st)continue;var p=leafPos(g,d);
      if(st==="d"){var nw=(i===0&&d===day&&o.newLeaf);
        mask+='<circle class="lit'+(nw?' new':'')+'" style="--i:'+d+'" cx="'+p.x.toFixed(0)+'" cy="'+p.y.toFixed(0)+'" r="'+(i===0?78:66)+'" fill="url(#soft)"/>';
        if(i===0)lit+='<circle class="lit'+(nw?' new':'')+'" style="--i:'+d+'" cx="'+p.x.toFixed(0)+'" cy="'+p.y.toFixed(0)+'" r="'+(nw?34:12)+'" fill="url(#lglow)"/>';}
      else if(st==="p"){lit+='<g class="pend"><circle cx="'+p.x.toFixed(0)+'" cy="'+p.y.toFixed(0)+'" r="30" fill="url(#gglow)"/><circle cx="'+p.x.toFixed(0)+'" cy="'+p.y.toFixed(0)+'" r="9" fill="none" stroke="var(--gold)" stroke-width="2"/></g>'}
    }
    if(day>=30&&rate(i,day,done)>=.8){var e=geo(i).e;fr+='<g class="fruit" style="--i:'+i+'"><circle cx="'+e.x+'" cy="'+e.y+'" r="26" fill="url(#gglow)"/><circle cx="'+e.x+'" cy="'+e.y+'" r="7" fill="#FFF2C4"/></g>'}
  }
  var prog=0;for(var r=0;r<12;r++)prog+=rate(r,day,done)*Math.min(30,day)/30;prog/=12;
  h+='<defs><mask id="'+id+'" maskUnits="userSpaceOnUse" x="0" y="0" width="752" height="1200"><rect width="752" height="1200" fill="#fff"/><g fill="#000">'+mask.replace(/fill="url\(#soft\)"/g,'fill="url(#softk)"')+'</g></mask>'+
     '<radialGradient id="softk"><stop offset="0" stop-color="#000"/><stop offset=".5" stop-color="#000" stop-opacity=".85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>'+
     '<linearGradient id="dk'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050914"/><stop offset=".78" stop-color="#050914"/><stop offset="1" stop-color="#050914" stop-opacity="0"/></linearGradient></defs>';
  /* الظلام يغطي التاج، ويخفّ مع تقدم الدفعة، ويُكشف حول كل ورقة «تم» */
  h+='<rect x="0" y="120" width="752" height="680" fill="url(#dk'+id+')" opacity="'+(0.88-0.55*prog).toFixed(2)+'" mask="url(#'+id+')"/>';
  h+=lit+fr;
  if(!mini){var tp=leafPos(geo(0),Math.max(1,Math.min(30,day)));h+='<text x="'+(tp.x-30)+'" y="'+(tp.y-22)+'" font-size="22" font-weight="600" fill="var(--gold)" text-anchor="middle" font-family="Alexandria,sans-serif" style="text-shadow:0 2px 8px #000">أنت</text>'}
  return h+'</svg>';
}
function doneCount(){var c=0;for(var r=0;r<12;r++)if(leafState(r,S.day,S.day,S.done)==="d")c++;return c}
function cohortRate(){var s=0;for(var r=0;r<12;r++)s+=rate(r,S.day,S.done);return Math.round(s/12*100)}
function vTree(){
  var w=WORDS[S.day%WORDS.length],harvest=S.day>=30,c=doneCount(),bd=leafState(1,S.day,S.day,S.done)==="d";
  return '<div class="hero"><img src="'+ART+'" alt=""><div class="fadet"></div>'+lightSVG({day:S.day,done:S.done,newLeaf:S.newLeaf})+'<div class="fadeb"></div>'+
  '<div class="hdr"><span class="brand">وتواصوا</span><span class="pill gold">اليوم '+N(S.day)+' من '+N(30)+'</span></div>'+
  '<div class="goal"><h1>'+S.goal+'</h1><p>'+S.sub+' · ١٢ غصنًا على سدرة واحدة</p></div></div>'+
  '<div class="act">'+(harvest?'<button class="big done" data-act="harvest"><i class="ring"></i>'+ic("check",2.6)+'<span>حصاد</span></button>':
   '<button class="big'+(S.done?' done':'')+'" data-act="check" aria-pressed="'+S.done+'"><i class="ring"></i>'+(S.done?ic("check",2.6)+'<span>ورقتك اليوم</span>':'<b>تم</b><span>اضغط عند الإنجاز</span>')+'</button>')+
  '<div class="stat"><span class="pill leaf">'+N(c)+' من ١٢ وضعوا ورقتهم</span><span class="pill">الشجرة '+N(cohortRate())+'٪</span></div></div>'+
  '<p class="goldline">عند الحصاد تُغرس سدرة حقيقية في الدوحة · هدية '+S.dedic+'</p>'+
  '<div class="word"><p class="ayah">'+w[0]+'</p><p class="xs mute">'+w[1]+' · كلمة اليوم</p></div>'+
  '<div class="card buddy row"><span class="av">م</span><div style="flex:1"><b class="small">رفيقك محمد</b><div class="xs" style="color:'+(bd?'var(--leaf)':'var(--mute)')+'">'+(bd?'غصنه مضيء اليوم':'غصنه مطفأ بعد')+'</div></div><button class="btn" data-act="nudge">'+(bd?'باركله':'اطمئن عليه')+'</button></div>'+
  '<div class="dev"><div class="row between"><b class="small">تجربة: شاهد السدرة تضيء</b><span class="xs mute">اسحب</span></div><input type="range" min="1" max="30" value="'+S.day+'" id="dayS" aria-label="اليوم"><div class="xs mute"><span>اليوم ١</span><span>الحصاد ٣٠</span></div></div>';
}
function vGarden(){
  var trees=[{n:"رمضان: ختمة",r:93},{n:"المشي، أبريل",r:77},{n:"الفجر، يونيو",r:85}];
  var h='<div class="pad" style="padding-top:calc(16px + env(safe-area-inset-top))"><div class="row between"><span class="brand" style="font-size:28px">وتواصوا</span><span class="pill gold">'+ic("garden")+'بستاني</span></div>'+
  '<h1 style="font-size:22px;font-weight:600;margin-top:12px">بستان خالد</h1><p class="mute small">كل سدرة دفعة أكملتها مع ناسها. البستان لا يُهدم، فقط يكبر.</p>'+
  '<div class="kpi"><div class="card"><b>'+N(3+(S.day>=30?1:0))+'</b><span>أشجار</span></div><div class="card"><b>'+N(97+S.day)+'</b><span>ورقة</span></div><div class="card"><b>'+N(3)+'</b><span>سدرات حقيقية</span></div></div><div class="garden">';
  trees.forEach(function(t,i){h+='<div class="card mini"><div class="thumb"><img src="'+ART+'" alt="">'+lightSVG({day:30,done:true,mini:true,k:i})+'</div><b>'+t.n+'</b><span class="xs mute">'+N(t.r)+'٪ · سدرة رقم '+N(1041+i*37)+'</span><span class="pill leaf" style="height:22px;font-size:10.5px">مغروسة في الدوحة</span></div>'});
  h+='<div class="card mini" style="border-color:rgba(240,206,131,.45)"><div class="thumb"><img src="'+ART+'" alt="">'+lightSVG({day:S.day,done:S.done,mini:true,k:9})+'</div><b>'+S.goal+'</b><span class="xs" style="color:var(--gold)">تضيء الآن · اليوم '+N(S.day)+'</span></div>';
  h+='<button class="card mini seed" data-act="join"><span class="s">'+ic("seed")+'</span><b>ازرع السدرة القادمة</b><span class="xs mute">تبدأ ١ يناير</span></button></div>'+
  '<button class="card forest" data-act="visit"><img src="'+ART2+'" alt=""><div class="t"><div class="row between"><b class="small">غابة وتواصوا، الدوحة</b><span class="pill leaf">'+N(3214)+' سدرة حقيقية</span></div><p class="xs mute">كل دفعة أكملت شجرتها غُرست باسمها سدرة بلوحة فيها الإهداء.</p></div></button></div>';
  return h;
}
var TABS=[["tree","tree","الشجرة"],["cohort","users","الأغصان"],["garden","garden","بستاني"]];
function render(){
  var v=S.tab==="garden"?vGarden():S.tab==="cohort"?'<div class="pad" style="padding-top:calc(60px + env(safe-area-inset-top))"><p class="mute">شاشة الأغصان: الخطوة التالية.</p></div>':vTree();
  $("screen").innerHTML='<div class="fade">'+v+'</div>';
  $("nav").innerHTML=TABS.map(function(x){return '<button data-go="'+x[0]+'"'+(S.tab===x[0]?' aria-current="page"':'')+'>'+ic(x[1])+'<span>'+x[2]+'</span></button>'}).join("");
  S.newLeaf=false;
}
var tT;function toast(m){var el=$("toast");el.textContent=m;el.classList.add("on");clearTimeout(tT);tT=setTimeout(function(){el.classList.remove("on")},2600)}
function spark(x,y){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;var host=$("device"),r=host.getBoundingClientRect(),cols=["#5CE3A8","#C2F5DE","#F0CE83","#FFF2C4"];
  for(var i=0;i<22;i++){var s=document.createElement("i");s.className="spark";s.style.background=cols[i%4];s.style.boxShadow="0 0 8px "+cols[i%4];s.style.left=(x-r.left)+"px";s.style.top=(y-r.top)+"px";host.appendChild(s);
    var a=-Math.PI/2+(Math.random()-.5)*1.4,d=110+Math.random()*160;
    s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px) scale(.2)",opacity:0}],{duration:1000+Math.random()*500,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=(function(el){return function(){el.remove()}})(s)}}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.go){S.tab=d.go;render();$("screen").scrollTop=0;return}
  if(d.act==="check"){var rc=b.getBoundingClientRect();S.done=!S.done;S.newLeaf=S.done;render();
    if(S.done){document.querySelector(".big").classList.add("pop");spark(rc.left+rc.width/2,rc.top+rc.height/2);if(navigator.vibrate)navigator.vibrate([12,40,18]);toast("أضاءت ورقتك. "+N(doneCount())+" من ١٢ اليوم")}
    else toast("أطفأنا ورقة اليوم")}
  else if(d.act==="nudge")toast("وصلته رسالة لطيفة باسمك");
  else if(d.act==="harvest")toast("الحصاد: شاشة الشهادة هي الخطوة التالية");
  else if(d.act==="join")toast("الدفعة القادمة تفتح يوم ٢٥ ديسمبر. سنذكّرك.");
  else if(d.act==="visit")toast("غابة وتواصوا، منطقة الروضة.");
});
document.addEventListener("input",function(e){if(e.target.id==="dayS"){S.day=+e.target.value;if(S.day<12)S.done=true;if(S.day>12)S.done=false;var sv=$("screen").scrollTop;render();$("screen").scrollTop=sv}});
if(Q.get("w"))$("device").style.maxWidth=Q.get("w")+"px";render();
if(Q.get("auto"))setTimeout(function(){var b=document.querySelector("[data-act=check]");if(b)b.click()},1500);
})();
</script>
</body>
</html>
